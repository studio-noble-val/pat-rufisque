<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site vitrine de l'ONG pour la Politique Alimentaire Territoriale de Rufisque.">
    <title>PAT Rufisque - Accueil </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared-styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        /* Dégradé pour la section Hero (similaire à style.css) */
        .hero-gradient {
            background: linear-gradient(135deg, #6fbf73 0%, #4caf50 100%);
        }

        /* Couleurs pour les boutons de la section Hero */
        .btn-hero-primary {
            background-color: #2c522d; /* Vert foncé de style.css */
            border: 2px solid #2c522d;
        }
        .btn-hero-primary:hover {
            background-color: #1e3a1f; /* Assombri */
        }
        .btn-hero-secondary {
            background-color: transparent;
            border: 2px solid #fff;
        }
        .btn-hero-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Couleurs pour les badges d'impact des cartes d'action (similaire à style.css) */
        .badge-impact {
            background-color: #e6f4ea; /* Vert clair */
            color: #4CAF50; /* Vert moyen */
        }

        /* Couleurs pour les badges des acteurs (similaire à style.css) */
        .badge-acteur-collectivites { background-color: #2196F3; } /* Bleu */
        .badge-acteur-societe { background-color: #FF9800; } /* Orange */
        .badge-acteur-prive { background-color: #795548; } /* Marron */
        .badge-acteur-recherche { background-color: #607D8B; } /* Gris bleu */
        .badge-acteur-partenaires { background-color: #009688; } /* Teal */

        /* Couleur de fond pour les sections alternées */
        .bg-section-alt {
            background-color: #f9f9f9; /* Léger fond gris de style.css */
        }
        /* Couleur de fond pour le footer (similaire à style.css) */
        .bg-footer-dark { background-color: #2c3e50; }
        .bg-footer-bottom-dark { background-color: #233140; }
        .text-footer-light { color: #ecf0f1; } /* Blanc cassé pour titres footer */
        .text-footer-muted { color: #bdc3c7; } /* Gris clair pour texte footer */

    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- Le header est supprimé pour l'intégration en iframe -->

    <main class="flex-grow" id="main-content">
        <!-- Le contenu sera injecté ici par JavaScript -->
    </main>

    <footer id="footer-container">
        <!-- Le footer sera injecté ici -->
    </footer>
    
    <!-- Le script d'assemblage -->
    <script src="js/main-builder.js"></script>

</body>
</html>
