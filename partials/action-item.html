<!--
MODIFICATIONS :
- Retour à une structure simple avec padding sur la carte principale.
- L'image est maintenant centrée (`mx-auto`) avec une taille contrôlée (`w-32 h-32`).
- `object-contain` est utilisé pour que l'illustration ne soit pas déformée.
- Le fond blanc de l'image se fondra avec le fond blanc de la carte.
-->
<div class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow duration-300 ease-in-out flex flex-col text-center">
    <img src="{{picto_url}}" alt="{{picto_alt}}" class="w-32 h-32 object-contain mx-auto mb-5">
    <h3 class="text-lg sm:text-xl font-semibold text-pat-green-darker mb-2">{{titre}}</h3>
    <p class="text-gray-600 text-sm mb-4 flex-grow">{{description}}</p>
    <span class="mt-auto inline-block badge-impact text-xs font-bold px-3 py-1.5 rounded-full">{{badge}}</span>
</div>
