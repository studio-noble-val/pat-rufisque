<div class="bg-white rounded-2xl shadow-lg overflow-hidden transition-shadow duration-300 hover:shadow-2xl">

    <!-- Corps de la carte: Image à gauche, Contenu à droite -->
    <div class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10 items-center">
        
        <!-- Colonne Image -->
        <div class="w-full {{image_column_order_class}}">
            <img src="{{image_url}}" alt="{{image_alt}}" class="rounded-xl object-cover w-full h-auto max-h-96 shadow-md aspect-video"> 
            <!-- aspect-video pour un ratio 16:9, max-h-96 pour limiter la hauteur -->
        </div>

        <!-- Colonne Contenu -->
        <div class="w-full flex flex-col h-full">
            <!-- Titre mis en valeur -->
            <h3 class="text-2xl sm:text-3xl font-bold text-pat-green-darker mb-4">
                {{titre}}
            </h3>
            
            <!-- Conteneur sous le titre: Picto à gauche, (Description + CTA) à droite -->
            <div class="flex-grow flex flex-col md:flex-row gap-6 items-start h-full">
                <!-- Picto avec une taille fixe pour garantir l'uniformité -->
                <div class="flex-shrink-0 mx-auto md:mx-0">
                    <img src="{{picto_url}}" alt="{{picto_alt}}" class="h-56 w-56 object-contain">
                </div>
                
                <!-- Bloc Description + CTA -->
                <div class="flex flex-col flex-grow h-full">
                    <p class="text-gray-700 leading-relaxed mb-4">
                        {{description}}
                    </p>
                    
                    <a href="{{lien_page}}" class="inline-flex items-center justify-center self-center px-6 py-3 border-2 border-pat-green-darker text-pat-green-darker font-bold rounded-lg shadow-lg hover:bg-pat-green-darker hover:bg-opacity-10 transition-all duration-300 text-base group">
                        <span>Explorer cet axe</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2 transition-transform duration-300 group-hover:translate-x-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
