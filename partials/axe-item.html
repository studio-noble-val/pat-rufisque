<div class="flex flex-col md:flex-row {{flex_direction_class}} items-center gap-6 md:gap-10 bg-white p-6 md:p-8 rounded-lg shadow-lg overflow-hidden">
    <div class="md:w-1/2 w-full">
        <img src="{{image_url}}" alt="{{image_alt}}" class="rounded-md object-cover h-64 md:h-full w-full">
    </div>
    <div class="md:w-1/2 w-full">
        <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <h3 class="text-xl sm:text-2xl font-semibold text-pat-green-principal mb-3 flex items-center gap-2">
            {{numero}}. {{titre}}
        </h3>
        <p class="text-gray-700 leading-relaxed">{{description}}</p>
        <a href="{{lien_page}}" class="inline-block mt-4 px-5 py-2 border-2 border-pat-green-principal text-pat-green-principal font-semibold rounded-md hover:bg-pat-green-principal hover:text-white transition-colors duration-300 text-sm">Explorer cet axe</a>
    </div>
</div>
