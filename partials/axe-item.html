<!-- Fichier : partials/axe-item.html -->

<!-- 
    CONTENEUR PRINCIPAL:
    - Gère l'ombre, l'arrondi, l'effet de survol et la disposition flex.
    - Important: IL N'A PLUS LA CLASSE DE BORDURE.
-->
<div class="group bg-white rounded-lg shadow-lg overflow-hidden transition-all duration-300 ease-in-out hover:shadow-xl hover:-translate-y-1 flex flex-col md:flex-row items-stretch">

    <!-- 
        COLONNE IMAGE:
        - Son ordre est géré dynamiquement par la classe injectée.
        - Aucun changement ici.
    -->
    <div class="w-full md:w-5/12 flex-shrink-0 self-stretch overflow-hidden {{image_column_order_class}}">
        <img src="{{image_url}}" alt="{{image_alt}}" class="object-cover w-full h-full transition-transform duration-300 ease-in-out group-hover:scale-110">
    </div>

    <!-- 
        COLONNE CONTENU:
        - C'est CETTE colonne qui reçoit maintenant la bordure.
        - Le padding (p-6/p-8) créera un espace entre la bordure et le texte, comme sur les KPIs.
        - La bordure sera toujours sur le côté qui "touche" l'image.
    -->
    <div class="w-full md:w-7/12 flex-grow flex flex-col p-6 md:p-8 {{border_class}} border-pat-green-principal">
        
        <h3 class="text-2xl sm:text-3xl font-bold text-pat-green-darker mb-4">
            {{titre}}
        </h3>
        
        <div class="flex-grow flex flex-col sm:flex-row gap-6 items-start">
            <div class="flex-shrink-0 mx-auto sm:mx-0">
                <img src="{{picto_url}}" alt="{{picto_alt}}" class="h-28 w-28 object-contain transition-transform duration-300 group-hover:scale-105">
            </div>
            
            <div class="flex flex-col flex-grow h-full">
                <p class="text-gray-700 leading-relaxed flex-grow mb-6">
                    {{description}}
                </p>
                
                <a href="{{lien_page}}" class="mt-auto self-start inline-flex items-center justify-center px-6 py-3 border-2 border-pat-green-darker text-pat-green-darker font-bold rounded-lg shadow-md hover:bg-pat-green-darker hover:bg-opacity-10 transition-all duration-300 text-base">
                    <span>Explorer cet axe</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2 transition-transform duration-300 group-hover:translate-x-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</div>
