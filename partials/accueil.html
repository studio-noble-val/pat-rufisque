<section id="accueil" class="text-gray-900 py-20 px-4 sm:px-6 lg:px-8 min-h-[80vh] flex items-center">
    <div class="container mx-auto flex flex-col md:flex-row items-center md:text-left">
        <div class="w-full md:w-5/12 mb-8 md:mb-0 md:pr-8 text-center md:text-left">
            <h1 class="text-4xl sm:text-5xl font-bold mb-5 leading-tight">{{accueil.titre}}</h1>
            <p class="text-lg sm:text-xl opacity-90 mb-8 max-w-3xl mx-auto md:mx-0">{{accueil.description}}</p>
            <div class="space-y-4 sm:space-y-0 sm:space-x-4">
                <a href="#axes" class="inline-block btn-hero-primary text-white font-bold py-3 px-6 rounded-md shadow-md hover:shadow-lg transition-transform duration-200 transform hover:-translate-y-0.5 text-base">{{accueil.bouton_primaire}}</a>
                <a href="#actions" class="inline-block btn-hero-primary text-white font-bold py-3 px-6 rounded-md shadow-md hover:shadow-lg transition-transform duration-200 transform hover:-translate-y-0.5 text-base">{{accueil.bouton_secondaire}}</a>
            </div>
        </div>
        <div class="w-full md:w-7/12">
            <div id="video-container" class="bg-black bg-opacity-10 p-3 sm:p-5 rounded-lg shadow-xl aspect-video">
                <div id="video-facade" class="relative w-full h-full bg-cover bg-center rounded-md cursor-pointer group" style="background-image: url('{{accueil.video_thumbnail}}');" data-videoid="{{accueil.video_id}}">
                    <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 group-hover:bg-opacity-50 transition-all duration-300 rounded-md">
                        <svg class="w-16 h-16 sm:w-20 sm:h-20 text-white transform group-hover:scale-110 transition-transform duration-300 drop-shadow-lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
