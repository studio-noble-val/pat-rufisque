<section id="actions" class="py-16 px-4 sm:px-6 lg:px-8 bg-section-alt">
    <div class="container mx-auto">
        <h2 class="text-3xl font-bold text-gray-900 mb-4 text-center">{{actions_concretes.titre}}</h2>
        <p class="text-lg text-gray-600 mb-12 max-w-3xl mx-auto text-center">{{actions_concretes.description}}</p>

        <!-- 
          MODIFICATION CLÉ: 
          On remplace 'grid' par 'flex flex-wrap' pour permettre aux éléments de passer à la ligne.
          'justify-center' va centrer les éléments sur chaque ligne. C'est ce qui centrera la 3ème carte 
          lorsqu'elle sera seule sur la deuxième ligne. 'items-stretch' donne à toutes les cartes d'une même
          ligne la même hauteur pour un meilleur alignement.
        -->
        <div class="flex flex-wrap justify-center items-stretch gap-8" id="actions-items-container">
            <!-- Les cartes d'action seront injectées ici par JavaScript -->
        </div>

        <div class="mt-12 text-center">
            <p class="text-lg text-gray-700 mb-4">{{actions_concretes.cta_etude.texte}}</p>
            <a href="{{actions_concretes.cta_etude.lien_pdf}}" target="_blank" class="inline-block btn-hero-primary text-white font-bold py-3 px-6 rounded-md shadow-md hover:shadow-lg transition-transform duration-200 transform hover:-translate-y-0.5 text-base">{{actions_concretes.cta_etude.bouton}}</a>
        </div>
    </div>
</section>
